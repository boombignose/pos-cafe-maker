<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="620" viewBox="0 0 1100 620" role="img" aria-labelledby="title desc">
<title id="title">BBN Café 5V accessory wiring prototype</title><desc id="desc">External regulated 5V isolated supply connects J1. Fuse F1 and Schottky D1 feed fan J2 and resistor R1 plus green LED D2. SBC and display use separate adapters.</desc>
<rect width="1100" height="620" fill="#f3f7fc"/>
<g font-family="sans-serif" fill="#13283c"><text x="45" y="50" font-size="27" font-weight="bold">5V DC ACCESSORY • PROTOTYPE</text><text x="45" y="83" font-size="17">Fan + power-present LED only • 0.5A total load ceiling at ambient ≤40°C</text>
<g stroke="#13283c" stroke-width="2" fill="white"><rect x="45" y="155" width="180" height="95" rx="12"/><rect x="265" y="155" width="120" height="95" rx="12"/><rect x="435" y="155" width="120" height="95" rx="12"/><rect x="605" y="155" width="155" height="95" rx="12"/><rect x="855" y="155" width="185" height="95" rx="12"/></g>
<g font-size="18"><text x="65" y="189">Regulated 5V DC</text><text x="65" y="218">isolated / ≤1A limit</text><text x="281" y="188">J1 INPUT</text><text x="281" y="218">1: +5V  2: −</text><text x="451" y="189">F1 PTC</text><text x="451" y="218">60R075XU</text><text x="620" y="189">D1 Schottky</text><text x="620" y="218">A1 → K2 band</text><text x="872" y="189">J2 → 5V FAN</text><text x="872" y="218">1: +OUT  2: −</text></g>
<g stroke="#c33c47" stroke-width="5" fill="none"><path d="M225 202H265M385 202H435M555 202H605M760 202H855"/><path d="M810 202V315H660"/></g>
<g stroke="#13283c" stroke-width="2" fill="white"><rect x="520" y="280" width="140" height="70" rx="10"/><rect x="325" y="280" width="140" height="70" rx="10"/></g><g font-size="18"><text x="539" y="309">R1 1kΩ</text><text x="539" y="334">0.25W / 1%</text><text x="345" y="309">D2 GREEN</text><text x="345" y="334">K2 ← A1</text></g><path d="M520 315H465" stroke="#c33c47" stroke-width="5"/>
<path d="M135 250V390H950V250M325 315H285V390" fill="none" stroke="#366bb3" stroke-width="5"/><text x="470" y="417" font-size="18">0V / GND common inside accessory circuit</text>
<text x="45" y="464" font-size="17">Output has diode/PTC drop: measure loaded voltage and verify fan starts reliably.</text><text x="45" y="493" font-size="17">F1 is thermal/resettable protection; it is not a precise 0.5A electronic limiter.</text><text x="45" y="548" font-size="19" font-weight="bold">SBC + DISPLAY: separate manufacturer-approved adapters</text><text x="45" y="579" font-size="17">No mains, GPIO control, battery charging, or bare brushed motor connection.</text></g></svg>
